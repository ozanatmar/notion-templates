<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="Live TradingView ticker tape strip, dark themed, sized for a slim Notion embed.">
<title>Ticker Tape</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1117'/%3E%3Cpath d='M2 5h12M2 11h12' stroke='%2358a6ff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1117; --line:#232a33;
    --ink:#e6edf3; --muted:#6b7480; --accent:#58a6ff;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  /* Slim strip: never scrolls, never shows a scrollbar. There is no panel, no page
     padding and no heading -- any of those would make it taller than the tape. */
  html,body{margin:0;padding:0;overflow:hidden}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}

  /* displayMode "regular" is the single-line row and sizes itself to 44px; "compact"
     is the stacked symbol/price/change layout and reserves 72px, which is what made
     this widget a tall block. Let the widget own its height and just clip anything
     that overflows, so there is never an inner scroll area. */
  #tvbox{width:100%;overflow:hidden}
  #tvbox iframe{display:block;border:0;width:100%!important}

  /* Static thin footer, outside the TradingView container so it can never scroll.
     Carries our credit and TradingView's required attribution on one line. */
  /* Plain inline flow, not flex: flex items cannot break across each other, so the
     TradingView link was pushed onto a line of its own on a narrow embed. */
  .foot{display:block;padding:2px 8px 3px;text-align:center;
    font:11px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--muted);text-wrap:balance}
  .foot a{color:var(--accent);text-decoration:none}
  .foot a:hover{text-decoration:underline}
  .foot a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .sep{color:var(--line)}

  .tvfail{margin:0;padding:10px 8px;text-align:center;color:var(--muted);font:11.5px/1.5 var(--mono)}
  @media(max-width:560px){ .foot{padding:2px 5px 3px;font-size:10px;line-height:1.25} }
</style>
</head>
<body>
<!-- TradingView replaces the inner div with its widget. Their own logo badge rides
     inside the tape; the text attribution below is required by their embed terms. -->
<div class="tradingview-widget-container" id="tvbox">
  <div class="tradingview-widget-container__widget"></div>
</div>

<footer class="foot">
  <span>This tool is developed by Ozan Atmar for the <a href="https://www.notion.com/templates/crypto-fx-trading-dashboard" target="_blank" rel="noopener">Crypto/FX Trading Dashboard v2</a> template.</span>
  <span class="sep" aria-hidden="true">&middot;</span>
  <a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">Track all markets on TradingView</a>
</footer>

<p class="tvfail" id="tvfail" hidden>Ticker unavailable &mdash; TradingView could not be reached.</p>

<script>
(function(){
  "use strict";
  // CAPITALCOM:DXY, not TVC:DXY: the latter returns a no-data error in the free embed.
  var DEFAULTS = ["BINANCE:BTCUSDT","BINANCE:ETHUSDT","BINANCE:SOLUSDT","FX:EURUSD","CAPITALCOM:DXY"];
  var MAX = 12;
  // Strict allowlist; values are serialised into the widget config. "!" is included
  // because TradingView continuous futures use it (ICEUS:DX1!).
  var SYMBOL_OK = /^[A-Za-z0-9_.:!\-]{1,32}$/;

  function q(name){
    try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; }
  }
  function parseSymbols(raw){
    if (!raw) return [];
    var out = [], parts = String(raw).split(",");
    for (var i = 0; i < parts.length; i++){
      var s = parts[i].trim().toUpperCase();
      if (SYMBOL_OK.test(s) && out.indexOf(s) === -1) out.push(s);
    }
    return out.slice(0, MAX);
  }
  // BINANCE:BTCUSDT -> BTC. USD is left alone so FX:EURUSD stays EURUSD, not EUR.
  function shortTitle(sym){
    var base = sym.indexOf(":") >= 0 ? sym.split(":")[1] : sym;
    return base.replace(/USDT$/, "") || base;
  }

  var symbols = parseSymbols(q("symbols"));
  if (!symbols.length) symbols = DEFAULTS.slice();

  var box = document.getElementById("tvbox");
  var fail = document.getElementById("tvfail");
  var settled = false;
  function ok(){ if (!settled){ settled = true; fail.hidden = true; } }
  function bad(){ if (!settled){ settled = true; fail.hidden = false; } }

  try {
    var seen = new MutationObserver(function(){
      if (box.querySelector("iframe")){ ok(); seen.disconnect(); }
    });
    seen.observe(box, { childList:true, subtree:true });

    var s = document.createElement("script");
    s.type = "text/javascript";
    s.async = true;
    s.src = "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
    s.onerror = bad;
    s.textContent = JSON.stringify({
      symbols: symbols.map(function(sym){ return { proName: sym, title: shortTitle(sym) }; }),
      showSymbolLogo: true,
      // Must stay false. With isTransparent:true this tape renders on a white
      // surface even under colorTheme:"dark", which is the opposite of the dark
      // strip we want; letting TradingView paint its own dark background matches.
      isTransparent: false,
      displayMode: "regular",
      colorTheme: "dark",
      locale: "en"
    });
    box.appendChild(s);

    setTimeout(function(){ if (box.querySelector("iframe")) ok(); else bad(); }, 10000);
  } catch (e) {
    bad();
  }
})();
</script>
</body>
</html>
