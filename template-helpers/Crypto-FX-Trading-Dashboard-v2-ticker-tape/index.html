<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="Live scrolling crypto ticker: 30 USDT pairs with price and 24h change, sized for a slim Notion embed.">
<title>Ticker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1117'/%3E%3Cpath d='M2 5h12M2 11h12' stroke='%2358a6ff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1117; --ink:#e6edf3; --muted:#6b7480;
    --up:#3fb950; --down:#f85149;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  /* The strip is the whole page: full height, no chrome, and it can never scroll. */
  html,body{height:100%;margin:0;padding:0;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  .row{position:relative;height:100%;overflow:hidden}
  /* Two identical copies of the set sit side by side; translating by exactly -50%
     lands copy 2 where copy 1 began, so the loop has no visible seam. Using a
     percentage rather than a pixel width keeps it seamless even when a price
     gets wider, because both copies always hold identical content. */
  .track{display:flex;align-items:stretch;height:100%;width:max-content;
    animation:marquee var(--dur,90s) linear infinite;will-change:transform}
  .row:hover .track{animation-play-state:paused}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  .card{display:flex;align-items:center;gap:9px;height:100%;padding:0 14px;flex:0 0 auto;
    background:transparent;border-right:1px solid rgba(230,237,243,.07)}

  .ico{width:26px;height:26px;flex:0 0 auto;border-radius:50%;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  .ico img{width:100%;height:100%;display:block}
  /* Last-resort mark, so a missing icon is never a broken image. */
  .ico.fallback{font:700 9px/1 var(--mono);color:#0d1117;letter-spacing:.01em}

  .txt{display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:78px}
  .sym{font:700 11px/1.25 var(--sans);letter-spacing:.05em;color:var(--ink)}
  .px{font:12px/1.25 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
  .chg{font:11px/1.25 var(--mono);font-variant-numeric:tabular-nums}
  .chg.up{color:var(--up)}
  .chg.down{color:var(--down)}

  /* Overlay, never a band: an empty state must not change the strip height. */
  .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:11.5px/1.5 var(--mono);color:var(--muted);text-align:center;padding:0 12px}
  .msg[hidden]{display:none}

  /* A perpetual marquee is hostile with reduced motion on. Stop it and let the row
     be scrolled instead, so every card is still reachable. */
  @media(prefers-reduced-motion:reduce){
    .track{animation:none}
    .row{overflow-x:auto;scrollbar-width:none}
    .row::-webkit-scrollbar{display:none}
  }
</style>
</head>
<body>
<div class="row" id="row">
  <div class="track" id="track"></div>
  <div class="msg" id="msg">Loading live prices&hellip;</div>
</div>

<script>
(function(){
  "use strict";
  var ENDPOINT = "/api/ticker";
  var REFRESH_MS = 12000;
  var FETCH_TIMEOUT_MS = 9000;
  var SPEED_PX_S = 45;                       // marquee speed, independent of set size

  var track = document.getElementById("track");
  var msg = document.getElementById("msg");
  var cards = new Map();                     // sym -> [cardRefs], one per copy
  var builtKey = "";
  var haveData = false;

  // Prices span 70,000 down to 0.000009, so decimals follow magnitude.
  function fmtPrice(v){
    if (v >= 1000)  return v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    if (v >= 1)     return v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4});
    if (v >= 0.01)  return v.toLocaleString("en-US",{minimumFractionDigits:4,maximumFractionDigits:4});
    return v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:8});
  }
  function fmtPct(v){ return (v >= 0 ? "+" : "") + v.toFixed(2) + "%"; }

  // Deterministic colour for the lettered fallback, so it reads as designed.
  function hueFor(sym){
    var h = 0;
    for (var i = 0; i < sym.length; i++) h = (h * 31 + sym.charCodeAt(i)) % 360;
    return "hsl(" + h + ",58%,62%)";
  }

  function iconEl(sym){
    var wrap = document.createElement("span");
    wrap.className = "ico";
    var lower = sym.toLowerCase();
    // cryptocurrency-icons is stale and misses about 12 of these 30 symbols;
    // coincap covers the rest. The lettered circle is the final fallback.
    var srcs = [
      "https://cdn.jsdelivr.net/npm/cryptocurrency-icons/svg/color/" + lower + ".svg",
      "https://assets.coincap.io/assets/icons/" + lower + "@2x.png"
    ];
    var stage = 0;
    var img = document.createElement("img");
    img.alt = "";
    img.decoding = "async";
    img.onerror = function(){
      stage++;
      if (stage < srcs.length){ img.src = srcs[stage]; return; }
      img.remove();
      wrap.classList.add("fallback");
      wrap.style.background = hueFor(sym);
      wrap.textContent = sym.slice(0, 3);
    };
    img.src = srcs[0];
    wrap.appendChild(img);
    return wrap;
  }

  function makeCard(t){
    var el = document.createElement("div");
    el.className = "card";
    el.appendChild(iconEl(t.sym));
    var txt = document.createElement("div");
    txt.className = "txt";
    var sym = document.createElement("span"); sym.className = "sym"; sym.textContent = t.sym;
    var px  = document.createElement("span"); px.className  = "px";
    var chg = document.createElement("span"); chg.className = "chg";
    txt.appendChild(sym); txt.appendChild(px); txt.appendChild(chg);
    el.appendChild(txt);
    return { el: el, px: px, chg: chg };
  }

  function build(list){
    var key = list.map(function(t){ return t.sym; }).join(",");
    if (key === builtKey) return false;
    builtKey = key;
    cards = new Map();
    track.innerHTML = "";
    for (var copy = 0; copy < 2; copy++){
      for (var i = 0; i < list.length; i++){
        var t = list[i];
        var c = makeCard(t);
        // The second copy exists only to close the loop visually.
        if (copy === 1) c.el.setAttribute("aria-hidden", "true");
        track.appendChild(c.el);
        if (!cards.has(t.sym)) cards.set(t.sym, []);
        cards.get(t.sym).push(c);
      }
    }
    return true;
  }

  function setDuration(){
    requestAnimationFrame(function(){
      var setWidth = track.scrollWidth / 2;
      if (setWidth > 0) track.style.setProperty("--dur", Math.round(setWidth / SPEED_PX_S) + "s");
    });
  }

  function paint(list){
    var rebuilt = build(list);
    for (var i = 0; i < list.length; i++){
      var t = list[i];
      var refs = cards.get(t.sym) || [];
      var priceText = fmtPrice(t.price);
      var chgText = fmtPct(t.changePct);
      var chgClass = "chg " + (t.changePct >= 0 ? "up" : "down");
      for (var j = 0; j < refs.length; j++){
        var c = refs[j];
        if (c.px.textContent !== priceText) c.px.textContent = priceText;
        if (c.chg.textContent !== chgText) c.chg.textContent = chgText;
        if (c.chg.className !== chgClass) c.chg.className = chgClass;
      }
    }
    if (rebuilt) setDuration();
    haveData = true;
    msg.hidden = true;
  }

  function load(){
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, FETCH_TIMEOUT_MS);
    // no-store stops the browser reusing its own stale copy; the URL is constant so
    // Vercel's edge cache still absorbs the load for everyone.
    return fetch(ENDPOINT, {
      signal: ctl.signal, cache: "no-store", headers: { Accept: "application/json" }
    }).then(function(res){
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function(data){
      if (!data || !Array.isArray(data.tickers) || !data.tickers.length) throw new Error("no tickers");
      paint(data.tickers);
    }).catch(function(){
      // Keep the last good render; only speak up if nothing was ever drawn.
      if (!haveData){ msg.hidden = false; msg.textContent = "Live prices unavailable, retrying…"; }
    }).then(function(){
      clearTimeout(timer);
    });
  }

  var poll = setInterval(load, REFRESH_MS);
  document.addEventListener("visibilitychange", function(){
    if (document.hidden){ clearInterval(poll); poll = null; }
    else if (!poll){ load(); poll = setInterval(load, REFRESH_MS); }
  });
  window.addEventListener("resize", setDuration);

  load();
})();
</script>
</body>
</html>
